# Builds the game with tsc and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Collect the site
        # The code goes in a folder named after this commit, and version.json says which one is
        # current, so browsers never mix old and new files. dist/ stays for pages loaded before this.
        run: |
          VERSION="${GITHUB_SHA::10}"
          mkdir _site
          cp index.html styles.css _site/
          cp -r dist "_site/dist-$VERSION"
          cp -r dist _site/dist
          echo "{\"version\": \"$VERSION\"}" > _site/version.json
          find _site -name '*.map' -delete
          cat _site/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
